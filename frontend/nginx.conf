# Port 80: certificate renewal, health check, and a redirect to HTTPS.
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location = /api/v1/health/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location / { return 301 https://$host$request_uri; }
}

# Port 443: the React app, the API, and the files Nginx may serve.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 6m;     # resumes are limited to 5 MB

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # API and Django admin. X-Forwarded-For is overwritten with the real client address,
  # so a client cannot fake its IP in the audit log or around the login rate limit.
  location ~ ^/(api|admin)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ { alias /srv/static/; expires 7d; }

  # Only the company logo is public. Resumes are never served from here.
  location /media/logos/ { alias /srv/media/logos/; expires 7d; }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
